{% extends "base.html" %}
{% block title %}{{ 'Edit' if trainer else 'Add' }} Trainer{% endblock %}
{% block content %}
<h3 class="mb-4">{{ 'Edit' if trainer else 'Add' }} Trainer</h3>
<div class="card-panel p-4" style="max-width:500px;">
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input type="text" name="trainer_name" class="form-control" required value="{{ trainer.trainer_name if trainer else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Specialization</label>
    <input type="text" name="specialization" class="form-control" value="{{ trainer.specialization if trainer else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control" value="{{ trainer.phone if trainer else '' }}">
  </div>
  <button type="submit" class="btn btn-brass">Save</button>
  <a href="{{ url_for('trainers.list_trainers') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
