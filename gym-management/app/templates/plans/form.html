{% extends "base.html" %}
{% block title %}{{ 'Edit' if plan else 'Add' }} Plan{% endblock %}
{% block content %}
<h3 class="mb-4">{{ 'Edit' if plan else 'Add' }} Plan</h3>
<div class="card-panel p-4" style="max-width:500px;">
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Plan Name *</label>
    <input type="text" name="plan_name" class="form-control" required value="{{ plan.plan_name if plan else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Duration (days) *</label>
    <input type="number" name="duration" class="form-control" required value="{{ plan.duration if plan else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Price (₹) *</label>
    <input type="number" step="0.01" name="price" class="form-control" required value="{{ plan.price if plan else '' }}">
  </div>
  <button type="submit" class="btn" style="background:#ff5c35;color:#fff;">Save</button>
  <a href="{{ url_for('plans.list_plans') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
