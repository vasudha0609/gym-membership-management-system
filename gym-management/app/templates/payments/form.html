{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<h3 class="mb-4">Record Payment</h3>
<div class="card-panel p-4" style="max-width:500px;">
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Member *</label>
    <select name="member_id" class="form-select" required>
      {% for m in members %}
        <option value="{{ m.member_id }}">{{ m.member_name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Amount (₹) *</label>
    <input type="number" step="0.01" name="amount" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      <option value="Completed">Completed</option>
      <option value="Pending">Pending</option>
      <option value="Failed">Failed</option>
    </select>
  </div>
  <button type="submit" class="btn" style="background:#ff5c35;color:#fff;">Save Payment</button>
  <a href="{{ url_for('payments.list_payments') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
